<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the inquiry desk works | Tigotek</title>
<meta name="description" content="A 1-minute look at how a wedding venue can reply to every inquiry within a minute, day or night.">
<meta property="og:title" content="Reply to every inquiry in one minute">
<meta property="og:description" content="A 1-minute look at how it works.">
<meta property="og:image" content="poster.jpg">
<style>
  :root { --paper:#fafaf7; --ink:#14130f; --muted:#6f6b61; --line:#e4e2db; --ember:#b4532a; }
  @media (prefers-color-scheme: dark) { :root { --paper:#121210; --ink:#f3f2ed; --muted:#a09c92; --line:#2c2b27; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
  main { max-width:880px; margin:0 auto; padding:28px 16px 48px; }
  .kicker { font-size:12px; letter-spacing:2.4px; text-transform:uppercase; color:var(--ember); font-weight:600; margin:0 0 10px; }
  h1 { font-family:Georgia, 'Times New Roman', serif; font-weight:400; font-size:clamp(28px, 6vw, 44px); line-height:1.15; letter-spacing:-0.5px; margin:0 0 18px; }
  video { display:block; width:100%; height:auto; border-radius:14px; border:1px solid var(--line); background:#000; }
  p { line-height:1.6; font-size:17px; }
  .muted { color:var(--muted); font-size:14px; }
  .reply { margin-top:22px; padding:18px 20px; border:1px solid var(--line); border-radius:14px; }
  .reply b { font-size:18px; }
</style>
</head>
<body>
<main>
  <p class="kicker">For wedding venues</p>
  <h1>Reply to every inquiry in one minute. Even at 11pm.</h1>
  <video controls playsinline preload="metadata" poster="poster.jpg">
    <source src="demo.mp4" type="video/mp4">
    Your browser can't play this video. <a href="demo.mp4">Download it here</a>.
  </video>
  <div class="reply">
    <b>Want this for your venue?</b>
    <p style="margin:6px 0 0;">Reply &ldquo;yes&rdquo; to the email we sent you. The first 20 venues get a lower price.</p>
  </div>
  <p class="muted">Willow Creek Barn is an example venue used for this demo. Tigotek &middot; tigotek.net</p>
</main>
</body>
</html>
